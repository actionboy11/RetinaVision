server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: retina-vision-backend

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  profiles:
    active: dev

mybatis-plus:
  # Mapper XML 文件统一放在 src/main/resources/mapper，长 SQL 不再写在 Java 注解里。
  mapper-locations: classpath:/mapper/*.xml


retina:
  redis:
    key-prefix: rv
    login:
      window: 15m
      username-max-failures: 5
      ip-max-failures: 20
    ai:
      minute-limit: 10  # 每分钟最多提交 10 个任务
      daily-limit: 500  # 每天最多提交 500 个任务
      zone-id: Asia/Shanghai
  ai:
    base-url: http://127.0.0.1:8000
    connect-timeout: 5s
    read-timeout: 5m
    health-connect-timeout: 2s
    health-read-timeout: 3s
  jwt:
    secret: retina-vision-dev-secret-retina-vision-dev-secret
    expire-hours: 24
  upload:
    image-root: uploads/images
  outbox:
    fixed-delay: 1s
    batch-size: 50
    retry-delay: 10s
    claim-timeout: 2m
  doctor-review:
    overdue-threshold-minutes: 120
