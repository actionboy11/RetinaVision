server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: retina-vision-backend

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  profiles:
    active: dev

mybatis-plus:
  # Mapper XML 文件统一放在 src/main/resources/mapper，长 SQL 不再写在 Java 注解里。
  mapper-locations: classpath:/mapper/*.xml


retina:
  jwt:
    secret: retina-vision-dev-secret-retina-vision-dev-secret
    expire-hours: 24
  upload:
    image-root: uploads/images
