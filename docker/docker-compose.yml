services:
  mysql:
    image: mysql:8.4
    container_name: retina_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: retina_vision
      MYSQL_USER: ${MYSQL_USER:-retina}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - retina_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  rabbitmq:
    image: rabbitmq:3-management
    container_name: retina_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-retina}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in docker/.env}
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - retina_rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7.4-alpine
    container_name: retina_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - retina_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: retina_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - retina_qdrant_data:/qdrant/storage

  retinavision-ai:
    build:
      context: ${RETINAVISION_AI_PROJECT_ROOT:-../ai-service}
      dockerfile: Dockerfile
    container_name: retina_ai
    restart: unless-stopped
    environment:
      RETINAVISION_AI_MODEL_PATH: /app/models/model_new.pth
      RETINAVISION_AI_STORAGE_ROOT: /app/storage
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RETINAVISION_AI_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../ai-service}/models/model_new.pth
        target: /app/models/model_new.pth
        read_only: true
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../ai-service}/storage
        target: /app/storage
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../ai-service}/logs
        target: /app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='UP' and data['ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  retina_mysql_data:
  retina_rabbitmq_data:
  retina_redis_data:
  retina_qdrant_data:
