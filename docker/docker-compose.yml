services:
  mysql:
    image: mysql:8.4
    container_name: retina_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: retina_vision
      MYSQL_USER: retina
      MYSQL_PASSWORD: retina123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - retina_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  rabbitmq:
    image: rabbitmq:3-management
    container_name: retina_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: retina
      RABBITMQ_DEFAULT_PASS: retina123456
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - retina_rabbitmq_data:/var/lib/rabbitmq

volumes:
  retina_mysql_data:
  retina_rabbitmq_data:
