services:
  mysql:
    image: mysql:8.4
    container_name: retina_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: retina_vision
      MYSQL_USER: retina
      MYSQL_PASSWORD: retina123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - retina_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  rabbitmq:
    image: rabbitmq:3-management
    container_name: retina_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: retina
      RABBITMQ_DEFAULT_PASS: retina123456
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - retina_rabbitmq_data:/var/lib/rabbitmq

  retinavision-ai:
    build:
      context: ${RETINAVISION_AI_PROJECT_ROOT:-../../retinavision-ai}
      dockerfile: Dockerfile
    container_name: retina_ai
    restart: unless-stopped
    environment:
      RETINAVISION_AI_MODEL_PATH: /app/models/model_new.pth
      RETINAVISION_AI_STORAGE_ROOT: /app/storage
      TZ: Asia/Shanghai
    ports:
      - "${RETINAVISION_AI_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../../retinavision-ai}/models/model_new.pth
        target: /app/models/model_new.pth
        read_only: true
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../../retinavision-ai}/storage
        target: /app/storage
      - type: bind
        source: ${RETINAVISION_AI_PROJECT_ROOT:-../../retinavision-ai}/logs
        target: /app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='UP' and data['ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  retina_mysql_data:
  retina_rabbitmq_data:
