name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.gitignore'
      - 'docker/**'
      - 'scripts/**'
      - 'README.md'
      - 'API_CONTRACT.md'
      - 'docs/BACKEND.md'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.gitignore'
      - 'docker/**'
      - 'scripts/**'
      - 'README.md'
      - 'API_CONTRACT.md'
      - 'docs/BACKEND.md'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: retina_vision
          MYSQL_USER: retina
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: retina
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/retina_vision?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: retina
      DB_PASSWORD: ci-app-password
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: retina
      RABBITMQ_PASSWORD: ci-rabbit-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-retinavision-jwt-secret-at-least-32-characters
      RETINA_LLM_ENABLED: 'false'
      RETINA_EMBEDDING_ENABLED: 'false'
      RETINA_REPORT_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure database collation
        run: |
          MYSQL_CONTAINER="$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n 1)"
          test -n "$MYSQL_CONTAINER"
          docker exec "$MYSQL_CONTAINER" mysql -uroot -pci-root-password \
            -e "ALTER DATABASE retina_vision CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Install report font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          test -f "$RETINA_REPORT_FONT_PATH"

      - name: Run backend tests
        run: mvn test
