name: AI Service CI

on:
  push:
    branches: [master]
    paths:
      - 'ai-service/**'
      - '.gitignore'
      - 'docker/**'
      - 'scripts/**'
      - 'README.md'
      - 'API_CONTRACT.md'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    paths:
      - 'ai-service/**'
      - '.gitignore'
      - 'docker/**'
      - 'scripts/**'
      - 'README.md'
      - 'API_CONTRACT.md'
      - '.github/workflows/ai-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests without local checkpoint
        run: python -m pytest -q tests -m "not model_integration"
